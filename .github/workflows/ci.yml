name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Parent repo is public; backend/frontend are private git submodules.
      # Default GITHUB_TOKEN cannot clone them — use a PAT with read access
      # to QuantumStore-Backend and QuantumBackend-Frontend (repo secret: SUBMODULE_PAT).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Verify submodules checked out
        run: |
          set -euo pipefail
          if [ ! -f backend/package.json ] || [ ! -f frontend/package.json ]; then
            echo "::error::Submodule checkout failed (backend/frontend package.json missing)."
            echo "The parent repo is public, but the submodules are private."
            echo "Add a repo secret SUBMODULE_PAT (classic PAT or fine-grained token)"
            echo "with Contents: Read on SENODROOM/QuantumStore-Backend and the frontend submodule."
            echo "Also ensure this workflow can use the secret on pull requests from forks"
            echo "(fork PRs cannot read secrets — push to a branch on the origin repo instead)."
            ls -la backend frontend || true
            exit 1
          fi
          echo "backend and frontend package.json present"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm install

      - name: Install workspace deps
        run: npm run install:all

      - name: Backend typecheck
        run: npm run typecheck --prefix backend

      - name: Backend unit tests
        run: npm test --prefix backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-at-least-16
          ADMIN_EMAIL: admin@quaantumlogicslimited.com
          ADMIN_PASSWORD: admin123

      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend

      - name: Frontend lint
        run: npm run lint --prefix frontend
        continue-on-error: true

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npx playwright test
        env:
          CI: true
          JWT_SECRET: test-secret-at-least-16
          ADMIN_EMAIL: admin@quaantumlogicslimited.com
          ADMIN_PASSWORD: admin123
          USE_MEMORY_DB: 'true'
